<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tsugaru WASM Test</title>
    <style>
        #output {
            width: 100%;
            height: 200px;
            background-color: #000;
            color: #0f0;
            font-family: monospace;
            padding: 10px;
            overflow-y: auto;
            white-space: pre-wrap;
            box-sizing: border-box;
            border: 1px solid #333;
            margin-top: 10px;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Tsugaru WASM Test Page</h1>
    <button id="init-btn" onclick="initEmulator()">Init Emulator</button>
    <br><br>
    <div id="dimensions">Canvas Dimensions: 0 x 0</div>
    <br>
    <div id="output"></div>
    <br>
    <canvas id="canvas" width="640" height="480" tabIndex="-1"></canvas>
    <canvas id="offscreen" width="640" height="480" style="display:none;"></canvas>

    <script>
        var isRendering = false;

        function logToOutput(text) {
            var output = document.getElementById('output');
            if (output) {
                output.innerText += text + '\n';
                output.scrollTop = output.scrollHeight;
            }
        }

        function fixGLEmulation() {
            if (typeof GL !== 'undefined' && GL.currentContext) {
                if (!GL.currentContext.tempVertexBufferCounters1) {
                    GL.currentContext.tempVertexBufferCounters1 = new Int32Array(32);
                }
                if (!GL.currentContext.tempVertexBufferCounters2) {
                    GL.currentContext.tempVertexBufferCounters2 = new Int32Array(32);
                }
                if (!GL.currentContext.tempVertexBuffers1) {
                    GL.currentContext.tempVertexBuffers1 = [];
                }
                if (!GL.currentContext.tempVertexBuffers2) {
                    GL.currentContext.tempVertexBuffers2 = [];
                }
            }
        }

        function startRenderLoop() {
            if (isRendering) return;
            isRendering = true;

            function renderStep() {
                fixGLEmulation();
                if (typeof Module !== 'undefined' && Module._tsugaru_get_framebuffer && Module._tsugaru_get_fb_width && Module._tsugaru_get_fb_height) {
                    var width = Module._tsugaru_get_fb_width();
                    var height = Module._tsugaru_get_fb_height();
                    var fbPtr = Module._tsugaru_get_framebuffer();

                    var dimElem = document.getElementById('dimensions');
                    if (dimElem) {
                        dimElem.innerText = "Canvas Dimensions: " + width + " x " + height;
                    }

                    if (width > 0 && height > 0 && fbPtr) {
                        var canvas = document.getElementById('canvas');
                        if (canvas.width !== width || canvas.height !== height) {
                            canvas.width = width;
                            canvas.height = height;
                        }
                        var ctx = canvas.getContext('2d');
                        if (ctx) {
                            var imgData = ctx.createImageData(width, height);
                            var pixels = new Uint8ClampedArray(Module.HEAPU8.buffer, fbPtr, width * height * 4);
                            imgData.data.set(pixels);
                            ctx.putImageData(imgData, 0, 0);
                        }
                    }
                }
                requestAnimationFrame(renderStep);
            }
            requestAnimationFrame(renderStep);
        }

        var Module = {
            canvas: (function() {
                return document.getElementById('offscreen');
            })(),
            locateFile: function(path, prefix) {
                return (prefix || '') + path;
            },
            print: function(text) {
                console.log(text);
                logToOutput(text);
            },
            printErr: function(text) {
                console.error(text);
                logToOutput('[ERR] ' + text);
            },
            onRuntimeInitialized: function() {
                logToOutput('Module runtime initialized.');
            }
        };

        function initEmulator() {
            logToOutput('Initializing emulator...');
            if (typeof tsugaru_init === 'function') {
                tsugaru_init();
            } else if (typeof Module !== 'undefined' && Module._tsugaru_init) {
                Module._tsugaru_init();
            } else if (typeof Module !== 'undefined' && Module.ccall) {
                Module.ccall('tsugaru_init', null, [], []);
            } else {
                logToOutput('tsugaru_init function not found!');
            }
            fixGLEmulation();
            startRenderLoop();
        }
    </script>
    <script src="Tsugaru_WASM.js"></script>
</body>
</html>

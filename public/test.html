<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tsugaru WASM Test</title>
    <style>
        #output {
            width: 100%;
            height: 200px;
            background-color: #000;
            color: #0f0;
            font-family: monospace;
            padding: 10px;
            overflow-y: auto;
            white-space: pre-wrap;
            box-sizing: border-box;
            border: 1px solid #333;
            margin-top: 10px;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Tsugaru WASM Test Page</h1>
    <button id="init-btn" onclick="initEmulator()">Init Emulator</button>
    <br><br>
    <div id="output"></div>
    <br>
    <canvas id="canvas" width="640" height="480" tabIndex="-1"></canvas>

    <script>
        function logToOutput(text) {
            var output = document.getElementById('output');
            if (output) {
                output.innerText += text + '\n';
                output.scrollTop = output.scrollHeight;
            }
        }

        var Module = {
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                return canvas;
            })(),
            locateFile: function(path, prefix) {
                if (path.endsWith('.wasm')) {
                    return (prefix || '') + path;
                }
                return (prefix || '') + path;
            },
            print: function(text) {
                console.log(text);
                logToOutput(text);
            },
            printErr: function(text) {
                console.error(text);
                logToOutput('[ERR] ' + text);
            },
            onRuntimeInitialized: function() {
                logToOutput('Module runtime initialized.');
            }
        };

        function initEmulator() {
            logToOutput('Initializing emulator...');
            if (typeof tsugaru_init === 'function') {
                tsugaru_init();
            } else if (typeof Module !== 'undefined' && Module._tsugaru_init) {
                Module._tsugaru_init();
            } else if (typeof Module !== 'undefined' && Module.ccall) {
                Module.ccall('tsugaru_init', null, [], []);
            } else {
                logToOutput('tsugaru_init function not found!');
            }
        }
    </script>
    <script src="Tsugaru_WASM.js"></script>
</body>
</html>
